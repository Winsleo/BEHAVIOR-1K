# OmniGibson data root: /BEHAVIOR-1K/datasets
# Cache directories: ${DATA_PATH:-./data}/isaac-sim/cache/
# Use OMNIGIBSON_HEADLESS=1 for headless mode

services:
  # Default service (supports both GUI and headless via OMNIGIBSON_HEADLESS env var)
  behavior-1k:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DEV_MODE: "0"
        INSTALL_EXTRAS: "eval,primitives"
        JOYLO_INSTALL: "false"
    image: behavior-1k:latest
    container_name: behavior-1k
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - DISPLAY=${DISPLAY:-}
      - OMNIGIBSON_DATA_PATH=/BEHAVIOR-1K/datasets
      - OMNI_KIT_ACCEPT_EULA=YES
      - OMNIGIBSON_HEADLESS=${OMNIGIBSON_HEADLESS:-0}
    volumes:
      - ../:/BEHAVIOR-1K:rw
      - ${DATA_PATH:-./data}/isaac-sim/cache/kit:/isaac-sim/kit/cache/Kit:rw
      - ${DATA_PATH:-./data}/isaac-sim/cache/ov:/root/.cache/ov:rw
      - ${DATA_PATH:-./data}/isaac-sim/cache/pip:/root/.cache/pip:rw
      - ${DATA_PATH:-./data}/isaac-sim/cache/glcache:/root/.cache/nvidia/GLCache:rw
      - ${DATA_PATH:-./data}/isaac-sim/cache/computecache:/root/.nv/ComputeCache:rw
      - ${DATA_PATH:-./data}/isaac-sim/logs:/root/.nvidia-omniverse/logs:rw
      - ${DATA_PATH:-./data}/isaac-sim/config:/root/.nvidia-omniverse/config:rw
      - ${DATA_PATH:-./data}/isaac-sim/data:/root/.local/share/ov/data:rw
      - ${DATA_PATH:-./data}/isaac-sim/documents:/root/Documents:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    working_dir: /BEHAVIOR-1K
    privileged: true
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: /bin/bash

  # JoyLo teleoperation service (requires separate image with JoyLo installed)
  behavior-1k-joylo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DEV_MODE: "0"
        INSTALL_EXTRAS: "eval,primitives"
        JOYLO_INSTALL: "true"
    image: behavior-1k:joylo
    container_name: behavior-1k-joylo
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - DISPLAY=${DISPLAY:-}
      - OMNIGIBSON_DATA_PATH=/BEHAVIOR-1K/datasets
      - OMNI_KIT_ACCEPT_EULA=YES
      - OMNIGIBSON_HEADLESS=${OMNIGIBSON_HEADLESS:-0}
    volumes:
      - ../:/BEHAVIOR-1K:rw
      - ${DATA_PATH:-./data}/isaac-sim/cache/kit:/isaac-sim/kit/cache/Kit:rw
      - ${DATA_PATH:-./data}/isaac-sim/cache/ov:/root/.cache/ov:rw
      - ${DATA_PATH:-./data}/isaac-sim/cache/pip:/root/.cache/pip:rw
      - ${DATA_PATH:-./data}/isaac-sim/cache/glcache:/root/.cache/nvidia/GLCache:rw
      - ${DATA_PATH:-./data}/isaac-sim/cache/computecache:/root/.nv/ComputeCache:rw
      - ${DATA_PATH:-./data}/isaac-sim/logs:/root/.nvidia-omniverse/logs:rw
      - ${DATA_PATH:-./data}/isaac-sim/config:/root/.nvidia-omniverse/config:rw
      - ${DATA_PATH:-./data}/isaac-sim/data:/root/.local/share/ov/data:rw
      - ${DATA_PATH:-./data}/isaac-sim/documents:/root/Documents:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    working_dir: /BEHAVIOR-1K
    # shm_size: '16g'  # Uncomment if PyTorch multiprocessing causes "Bus error"
    stdin_open: true
    tty: true
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: /bin/bash
    profiles:
      - joylo
